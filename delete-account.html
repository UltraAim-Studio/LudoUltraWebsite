<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request deletion of your Ludo Ultra account.">
    <meta name="theme-color" content="#0a1638">
    <title>Delete My Ludo Ultra Account</title>
    <link rel="icon" type="image/png" href="assets/images/Ludo%20Ultra%20App%20Icon%20512.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="account-deletion-page">
    <main class="container deletion-container">
        <header class="deletion-header">
            <img src="assets/images/Ludo%20Ultra%20App%20Icon%20512.png" width="88" height="88" alt="Ludo Ultra 3D">
            <p class="deletion-eyebrow">ACCOUNT SUPPORT</p>
            <h1>Delete My <span>Ludo Ultra</span> Account</h1>
            <p>Submit a request to delete your Ludo Ultra account.</p>
        </header>

        <section class="deletion-panel" aria-labelledby="deletionFormTitle">
            <h2 id="deletionFormTitle">Account deletion request</h2>

            <form class="feedback-form deletion-form" id="deletionForm">
                <div class="form-row">
                    <div class="deletion-field">
                        <label for="deletionEmail">Email *</label>
                        <input id="deletionEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="deletion-field">
                        <label for="gameUserId">Game User ID *</label>
                        <input id="gameUserId" name="gameUserId" type="text" autocomplete="off" spellcheck="false" placeholder="Enter your Game User ID" required>
                    </div>
                </div>

                <div class="deletion-field">
                    <label for="deletionReason">Reason for deletion *</label>
                    <select id="deletionReason" name="reason" required>
                        <option value="" disabled selected>Select a reason</option>
                        <option>I no longer play the game</option>
                        <option>I want to reduce my gaming time</option>
                        <option>I have privacy or data concerns</option>
                        <option>I experienced technical issues or bugs</option>
                        <option>I am not satisfied with the gameplay</option>
                        <option>I had a negative multiplayer experience</option>
                        <option>I have a duplicate or unused account</option>
                        <option>I want to start fresh</option>
                        <option value="other">Other — write your own reason</option>
                        <option>Prefer not to say</option>
                    </select>
                </div>

                <div class="deletion-field">
                    <label for="deletionFeedback">Feedback Message *</label>
                    <textarea id="deletionFeedback" name="feedback" rows="5" maxlength="5000" placeholder="Tell us what we could improve..." required></textarea>
                </div>

                <div class="deletion-field" id="customReasonField" hidden>
                    <label for="customReason">Your reason *</label>
                    <textarea id="customReason" name="customReason" rows="3" maxlength="2000" placeholder="Tell us your reason for deletion" disabled></textarea>
                </div>

                <fieldset class="deletion-timing">
                    <legend>Deletion time selection *</legend>
                    <div class="deletion-options">
                        <label class="deletion-option">
                            <input type="radio" name="deletionTiming" value="immediately" aria-describedby="immediatelyHelp" required>
                            <span><strong>Immediately</strong><span id="immediatelyHelp">Delete your account after your request is reviewed and verified.</span></span>
                        </label>
                        <label class="deletion-option">
                            <input type="radio" name="deletionTiming" value="after-30-days" aria-describedby="thirtyDaysHelp" required>
                            <span><strong>After 30 days</strong><span id="thirtyDaysHelp">Keep your account active for 30 days before deletion is processed.</span></span>
                        </label>
                    </div>
                </fieldset>

                <button class="dice-btn" type="submit" aria-describedby="deletionCooldown" disabled>Submit deletion request</button>
                <p class="deletion-help" id="deletionCooldown"></p>
                <p class="deletion-help" id="deletionStatus" role="status" aria-live="polite"></p>
            </form>
        </section>
        <footer class="deletion-footer">Ludo Ultra 3D · Account Support</footer>
    </main>
    <script src="delete-account.js"></script>
</body>
</html>
